name: Compilar APK Muviel

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar carpeta web y configuracion
        run: |
          mkdir -p www
          # Corregir nombre si fue traducido
          if [ -f "indice.html" ] && [ ! -f "index.html" ]; then
            mv indice.html index.html
          fi
          # Copiar recursos a la carpeta www
          cp index.html www/
          [ -f "manifest.json" ] && cp manifest.json www/ || true
          [ -f "sw.js" ] && cp sw.js www/ || true

          # Crear configuracion oficial de Capacitor
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.muviel.app",
            "appName": "Muviel",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Instalar Capacitor y preparar proyecto Android
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap add android
          npx cap sync android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Muviel-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
