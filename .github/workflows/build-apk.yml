name: Compilar APK Muviel

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Preparar carpeta web
        run: |
          mkdir -p www
          # Renombrar si el navegador tradujo el archivo
          if [ -f "indice.html" ] && [ ! -f "index.html" ]; then
            mv indice.html index.html
          fi
          # Copiar archivos a www
          cp index.html www/
          [ -f "manifest.json" ] && cp manifest.json www/ || true
          [ -f "sw.js" ] && cp sw.js www/ || true

      - name: Instalar Capacitor y configurar proyecto
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Muviel" "com.muviel.app" --web-dir www
          npx cap add android

      - name: Sincronizar archivos web a Android
        run: |
          npx cap sync android

      - name: Compilar APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Muviel-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
