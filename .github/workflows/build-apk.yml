name: Compilar APK Muviel

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar carpeta web
        run: |
          mkdir -p www
          # Renombrar indice.html si fue traducido
          if [ -f "indice.html" ] && [ ! -f "index.html" ]; then
            mv indice.html index.html
          fi
          # Copiar archivos
          cp index.html www/
          [ -f "manifest.json" ] && cp manifest.json www/ || true
          [ -f "sw.js" ] && cp sw.js www/ || true

      - name: Instalar Capacitor y configurar plataforma Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Muviel" "com.muviel.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Muviel-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
