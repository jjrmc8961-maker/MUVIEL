name: Compilar APK Muviel

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Renombrar indice a index si aplica
        run: |
          if [ -f "indice.html" ] && [ ! -f "index.html" ]; then
            mv indice.html index.html
          fi

      - name: Instalar Capacitor y dependencias
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Muviel" "com.muviel.app" --web-dir .
          npx cap add android

      - name: Sincronizar archivos web a Android
        run: |
          npx cap sync android

      - name: Compilar APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Muviel-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

