name: Compilar APK Muviel

on:
  push:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar carpeta web y configuracion
        run: |
          mkdir -p www
          if [ -f "indice.html" ] && [ ! -f "index.html" ]; then
            mv indice.html index.html
          fi
          cp index.html www/
          [ -f "manifest.json" ] && cp manifest.json www/ || true
          [ -f "sw.js" ] && cp sw.js www/ || true

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.muviel.app",
            "appName": "Muviel",
            "webDir": "www"
          }
          EOF

      - name: Instalar dependencias y configurar Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications
          npx cap add android
          npx cap sync android

      - name: Habilitar permisos de notificaciones en AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Inyectar permisos de notificaciones y alarmas exactas
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />' $MANIFEST

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Muviel-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
